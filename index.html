<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>How2Prompt</title>
    <script>
      // Applied before first paint to avoid a flash of the wrong theme —
      // kept in sync with src/shared/context/ThemeProvider.tsx's storage key
      // and fallback-to-system logic.
      ;(function () {
        var stored = null
        try {
          stored = localStorage.getItem('how2prompt-theme:v1')
        } catch {
          // storage unavailable (private mode, quota) — fall back to system preference
        }
        var isDark =
          stored === 'dark' ||
          (stored !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches)
        document.documentElement.classList.toggle('dark', isDark)
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
